packages:
  - 'apps/*'
  - 'packages/*'

# pnpm 10+ blocks dependency lifecycle scripts by default. These four genuinely
# need theirs: prisma generates the typed client, esbuild unpacks its native
# binary. Anything not listed here stays blocked.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  prisma: true
